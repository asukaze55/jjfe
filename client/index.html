<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <meta charset="UTF-8">
  <title>JJFE</title>
  <style>
    h1 {
      font-size: 110%;
      margin: 4px;
    }
    .section-header {
      display: flex;
    }
    .file-header {
      background: #cc3;
      border-top: 1px solid #000;
      display: flex;
    }
    .header-label {
      flex: auto;
    }
    .actions {
      text-align: end;
    }
    .diff {
      display: inline-block;
      font-family: monospace;
      overflow-x: scroll;
      white-space: pre;
      width: 50%;
    }
    .diff > div {
      height: 1.2em;
    }
    .diff > .section {
      background: #ccc;
    }
    .diff div.del {
      background: #fcc;
    }
    .diff span.del {
      background: #f99;
    }
    .diff div.ins {
      background: #cfc;
    }
    .diff span.ins {
      background: #9f9;
    }
    .file {
      font-family: monospace;
      overflow-x: scroll;
      white-space: pre;
    }
    .file .match {
      background: #ff0;
      font-weight: bold;
    }
    .line::before {
      border-right: solid 1px #000;
      content: attr(data-line-number);
      display: inline-block;
      height: 100%;
      margin-right: 8px;
      min-width: 2em;
      padding-right: 8px;
      text-align: right;
    }
    .log {
      font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
      width: 50vw;
    }
    .menu {
      border: 1px solid #000;
      margin: 0;
      padding: 0;
    }
    .menu ul {      
      padding: 0;
      margin: 0;
    }
    .menu li {
      cursor: default;
      font-size: 90%;
      list-style: none;
      padding: 4px;
    }
    .tip {
      background: #fff;
      border: 1px solid #000;
      margin: 0;
      opacity: .8;
      padding: 0;
      pointer-events: none;
      position: absolute;
    }
  </style>
</head>
<body>

<div id="jjfe"></div>

<script src="asukaze_module.js"></script>
<script src="asukaze_dom.js"></script>
<script src="fetch_jj_dev.js"></script>
<script src="jjfe.js"></script>
</body>
</html>
