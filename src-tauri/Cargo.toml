[package]
name = "jjfe"
version = "0.9.0"
description = "JJ Frontend"
authors = ["asukaze55"]
license = "MIT"
repository = "https://github.com/asukaze55/jjfe"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "jjfe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
tauri = { version = "2", features = [] }
